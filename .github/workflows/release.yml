name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (example: v0.1-Alpha)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${TAG}"

      - name: Build Release APK
        run: ./gradlew assembleDebug

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/debug
          for apk in *.apk; do
            arch=$(echo "$apk" | sed 's/app-//;s/-debug.apk//')
            mv "$apk" "elsnime-${{ steps.version.outputs.tag }}-${arch}.apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Elsnime ${{ steps.version.outputs.tag }}"
          body: |
```yaml
  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: ${{ steps.version.outputs.tag }}
      name: "Elsnime ${{ steps.version.outputs.tag }}"
      body: |
        # Elsnime ${{ steps.version.outputs.tag }}

        Download the APK for your device:

        | Architecture | APK |
        |:-------------|:----|
        | **ARM64** | `elsnime-${{ steps.version.outputs.tag }}-arm64-v8a.apk` |
        | **ARMv7** | `elsnime-${{ steps.version.outputs.tag }}-armeabi-v7a.apk` |
        | **x86_64** | `elsnime-${{ steps.version.outputs.tag }}-x86_64.apk` |
        | **x86** | `elsnime-${{ steps.version.outputs.tag }}-x86.apk` |

        ## Installation

        1. Download the APK from **Assets** below.
        2. Open the APK and install it.
        3. If prompted, allow your browser or file manager to install apps from unknown sources.

        > **Play Protect:** You may see a warning because Elsnime isn't distributed through Google Play or verified by Google. If you trust this release, tap **More details** → **Install anyway** to continue.

        **Minimum Android:** 5.0 (API 21)  
        **License:** GPL-3.0
      files: app/build/outputs/apk/debug/elsnime-*.apk
      draft: false
      prerelease: false
