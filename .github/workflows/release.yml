name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (example: v0.1-Alpha)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${TAG}"

      - name: Prepare Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release

          for apk in *.apk; do
            arch=$(echo "$apk" | sed 's/app-//;s/-release.apk//')
            mv "$apk" "elsnime-${{ steps.version.outputs.tag }}-${arch}.apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Elsnime ${{ steps.version.outputs.tag }}"
          body: |
            # Elsnime ${{ steps.version.outputs.tag }}

            ## Installation

            1. Download the APK from **Assets** below.
            2. Open the APK and install it.
            3. If prompted, allow your browser or file manager to install apps from unknown sources.

            > **Play Protect**: Google Play Protect may need to scan the app before installation. If the scan passes, you can install normally. If Play Protect reports a warning and you trust this release, review the warning and choose More details → Install anyway if that option is available.

            **Minimum Android:** 6.0+ (API 23)
            **License:** GPL-3.0
          files: app/build/outputs/apk/release/elsnime-*.apk
          draft: false
          prerelease: false
