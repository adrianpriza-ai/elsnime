name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (example: v0.1-Alpha)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9].* ]]; then
            echo "::error::Tag must start with 'v' (got: $TAG)"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${TAG}"

      - name: Prepare Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore prepared at $RUNNER_TEMP/release.jks"

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v secret is not set"; exit 1; fi
          done
          ./gradlew assembleRelease --stacktrace

      - name: Show APK info
        if: always()
        run: |
          echo "### Release APKs" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || echo "No APKs found" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          sha256sum app/build/outputs/apk/release/*.apk 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Rename APKs
        run: |
          shopt -s nullglob
          cd app/build/outputs/apk/release
          files=( *.apk )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No APKs found in app/build/outputs/apk/release/"
            exit 1
          fi
          for apk in "${files[@]}"; do
            arch=$(echo "$apk" | sed 's/^app-//;s/-release\.apk$//')
            # Fallback if sed produced empty (e.g., universal APK)
            if [ -z "$arch" ] || [ "$arch" = "$apk" ]; then arch="universal"; fi
            dest="elsnime-${{ steps.version.outputs.tag }}-${arch}.apk"
            echo "$apk -> $dest"
            mv -v "$apk" "$dest"
          done
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Elsnime ${{ steps.version.outputs.tag }}"
          body: |
            # Elsnime ${{ steps.version.outputs.tag }}

            ## Installation

            1. Download the APK from **Assets** below.
            2. Open the APK and install it.
            3. If prompted, allow your browser or file manager to install apps from unknown sources.

            > **Play Protect**: Google Play Protect may need to scan the app before installation. If the scan passes, you can install normally. If Play Protect reports a warning and you trust this release, review the warning and choose More details → Install anyway if that option is available.

            **Minimum Android:** 6.0+ (API 23)
            **License:** GPL-3.0
          files: app/build/outputs/apk/release/elsnime-*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
