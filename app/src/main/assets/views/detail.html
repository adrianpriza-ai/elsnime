<!-- Detail -->
<div class="view" id="view-detail">
	<button class="back-btn" onclick="popView()">
		<svg
			width="18"
			height="18"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2"
			stroke-linecap="round"
			stroke-linejoin="round"
		>
			<polyline points="15 18 9 12 15 6"></polyline>
		</svg>
		Back
	</button>

	<div class="detail-hero" id="detail-hero">
		<img
			id="detail-banner"
			src
			alt
			onerror="hideDetailBanner(this)"
		/>
		<div class="detail-hero-scrim"></div>
		<div class="detail-hero-inner">
			<img id="detail-cover" class="detail-hero-poster" src alt />
			<div class="detail-hero-meta">
				<div class="detail-title" id="detail-title">&mdash;</div>
				<div class="detail-subtitle" id="detail-subtitle"></div>
				<div class="badge-row" id="detail-badges"></div>
			</div>
		</div>
	</div>

	<div class="detail-cols">
		<div class="detail-main">
			<div class="detail-actions">
				<button
					class="yt-play-btn"
					id="btn-play-first"
					onclick="playFirstEp()"
					disabled
				>
					<svg viewBox="0 0 24 24">
						<polygon points="6 3 20 12 6 21 6 3"></polygon>
					</svg>
					Play
				</button>
				<button
					class="yt-play-btn yt-play-btn--ghost"
					id="btn-download-all"
					onclick="downloadSeries()"
					disabled
				>
					<svg viewBox="0 0 24 24">
						<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
						<polyline points="7 10 12 15 17 10"></polyline>
						<line x1="12" y1="15" x2="12" y2="3"></line>
					</svg>
					<span class="btn-dl-all-label">Download All</span>
				</button>
				<button
					class="yt-play-btn yt-play-btn--ghost yt-play-btn--save"
					id="btn-save-later"
					onclick="toggleSaveLater()"
					disabled
				>
					<svg viewBox="0 0 24 24">
						<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
					</svg>
					<span class="btn-save-label">Save for later</span>
				</button>
				<div class="seg-ctrl" id="detail-seg-ctrl">
					<button
						class="seg-btn active"
						data-lang="sub"
						onclick="switchTranslation('sub', this)"
					>
						SUB
					</button>
					<button
						class="seg-btn"
						data-lang="dub"
						onclick="switchTranslation('dub', this)"
					>
						DUB
					</button>
				</div>
			</div>

			<div class="yt-desc-box">
				<div id="detail-desc"></div>
				<button
					class="yt-more-btn"
					id="detail-more-btn"
					onclick="toggleDesc()"
				>
					Show more
				</button>
			</div>
		</div>

		<div class="detail-side">
			<div class="upnext-head">
				<span class="section-title">Episodes</span>
				<span class="upnext-count" id="ep-count"></span>
			</div>
			<div id="eps-grid"></div>
		</div>
	</div>
</div>
