<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<!-- Declare both color schemes so the Android WebView reports the real
		     system theme to prefers-color-scheme without algorithmically
		     darkening the page (the app themes itself). -->
		<meta name="color-scheme" content="dark light" />
		<title>Elsnime</title>
		<!-- No web fonts: the app uses the system sans-serif (Roboto on Android)
		     so nothing is downloaded from a CDN and the UI works offline.
		     Plyr + hls.js are vendored locally (vendor/). -->
		<link rel=stylesheet href=vendor/plyr.css>
		<link rel=stylesheet href=css/base.css>
		<link rel=stylesheet href=css/layout.css>
		<link rel=stylesheet href=css/search.css>
		<link rel=stylesheet href=css/cards.css>
		<link rel=stylesheet href=css/detail.css>
		<link rel=stylesheet href=css/downloads.css>
		<link rel=stylesheet href=css/player.css>
		<link rel=stylesheet href=css/youtube.css>
		<link rel=stylesheet href=css/history.css>
		<link rel=stylesheet href=css/settings.css>
		<link rel=stylesheet href=css/library.css>
		<link rel=stylesheet href=css/toast.css>
		<link rel=stylesheet href=css/resolve.css>
		<link rel=stylesheet href=css/refresh.css>
		<link rel=stylesheet href=css/responsive.css>
	</head>
	<body>
		<!-- The app's HTML is split into views/*.html partials (see
		     js/ui-loader.js), so this file is only a shell. ui-loader injects
		     the views into #main, the bottom nav into #bottom-nav and the
		     overlays into #overlays, then boot.js wires everything up. -->
		<div id="app">
			<main id="main"></main>
			<nav id="bottom-nav"></nav>
		</div>
		<div id="overlays"></div>
		<!-- Plyr 3: player UI. HLS (m3u8) is played through hls.js, wired manually
		     in player.js (Plyr 3.6+ has no built-in hls.js support) — the master
		     playlist feeds the settings > quality menu via quality.onChange.
		     Both libraries are vendored locally (vendor/), so playback doesn't
		     depend on a CDN (works offline). -->
		<script src="vendor/plyr.min.js"></script>
		<script src="vendor/hls.min.js"></script>
		<!-- ui-loader must come before every other script: it fetches the HTML
		     partials and exposes window.__UI_READY, which boot.js awaits before
		     starting the app. -->
		<script src="js/ui-loader.js"></script>
		<script src="js/core.js"></script>
		<script src="js/search.js"></script>
		<script src="js/home.js"></script>
		<script src="js/detail.js"></script>
		<script src="js/player.js"></script>
		<script src="js/downloads.js"></script>
		<script src="js/history.js"></script>
		<script src="js/watchlater.js"></script>
		<script src="js/boot.js"></script>
	</body>
</html>
