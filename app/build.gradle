plugins { id 'com.android.application' }

android {
    namespace = 'com.elsnime'
    compileSdk = 35
    defaultConfig {
        applicationId = 'com.elsnime'
        minSdk = 23
        targetSdk = 35
        versionCode = 1
        versionName = '0.2-Alfa'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk = false
        }
    }
    bundle {
        abi { enableSplit = true } // Play Store path: per-ABI delivery (default, explicit)
    }
    signingConfigs {
        // Only define the release signing config when all keystore env vars are
        // present, so debug builds work without a keystore. Values only matter
        // for release builds. The locals are prefixed (env*) because they'd
        // otherwise shadow the keyAlias/keyPassword DSL methods: `keyAlias
        // keyAlias` would be parsed as a call on the String, not the setter.
        def envKeystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
        def envKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
        def envKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
        def envKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
        if (envKeystoreFile && envKeystorePassword && envKeyAlias && envKeyPassword) {
            release {
                storeFile file(envKeystoreFile)
                storePassword envKeystorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        }
    }

    buildTypes {
        release {
            def sc = signingConfigs.findByName("release")
            if (sc != null) {
                signingConfig sc
            } else {
                logger.warn("Release build is unsigned: set ANDROID_KEYSTORE_FILE, " +
                        "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD to sign.")
            }
            minifyEnabled false
        }
    }
}

dependencies {
    // Cronet: the Chromium network stack. Its TLS ClientHello (JA3/JA4) is a
    // genuine Chrome fingerprint, so Cloudflare's TLS checks on anidb.app pass —
    // the Android equivalent of the curl-impersonate binaries ani-cli uses.
    // cronet-api is the public API surface; cronet-embedded bundles the native
    // implementation + libs (no Google Play services dependency).
    implementation 'org.chromium.net:cronet-api:143.7445.0'
    implementation 'org.chromium.net:cronet-embedded:143.7445.0'

    // Media3 muxer: the pure-Java MP4 writer used for the .ts → .mp4 remux.
    // The system MediaMuxer is never used — its native MPEG4Writer aborts the
    // whole process on some devices (uncatchable). Media3's muxer is pure
    // Java (can only throw, which the downloader catches and falls back to
    // keeping the .ts) and handles B-frames (ctts), edit lists and Annex-B
    // sample conversion itself. 1.9.4 is the newest release that only needs
    // compileSdk 35 (1.10+ requires 36).
    implementation 'androidx.media3:media3-muxer:1.9.4'
}
